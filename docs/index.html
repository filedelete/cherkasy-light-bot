<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Світло · Черкаська область</title>
<meta name="description" content="Графік відключень електроенергії у Черкаській області: твоя черга, що зараз і коли наступне відключення.">
<meta name="theme-color" content="#0e1420">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23f2b33d'/%3E%3Cpath d='M36 8 18 36h12l-4 20 20-30H33z' fill='%231c1608'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1420; --panel:#161f2f; --panel2:#1d2940; --line:#293650;
  --text:#eaf0fa; --muted:#8a97b0;
  --on:#2bae74; --off:#e8484f; --maybe:#f2b33d; --accent:#f2b33d; --accent-ink:#1c1608;
  --shadow:0 8px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f5fa; --panel:#fff; --panel2:#eef2f9; --line:#dbe2ef; --text:#141c2c; --muted:#617088; --shadow:0 8px 30px rgba(20,28,44,.08); }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.logo{width:46px;height:46px;border-radius:14px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:26px;height:26px}
h1{font-size:22px;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px;margin-top:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--panel);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.seg button{border:0;background:none;color:var(--muted);font:inherit;font-weight:700;padding:10px 8px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.seg small{display:block;font-weight:500;font-size:12px;opacity:.85}
.picker{margin-bottom:14px}
.qgrid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(var(--rows,2),auto);grid-auto-columns:1fr;gap:8px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-weight:700;padding:11px 0;border-radius:12px;cursor:pointer;text-align:center;min-width:0}
.chip.wide{width:100%;margin-bottom:8px;padding:11px 14px}
@media (hover:hover){.chip:hover{border-color:var(--muted)}}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.card{background:var(--panel);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.status{display:flex;gap:14px;align-items:center}
.dot{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-size:26px;flex:none}
.dot.on{background:color-mix(in srgb,var(--on) 22%,transparent)}
.dot.off{background:color-mix(in srgb,var(--off) 22%,transparent)}
.status b{display:block;font-size:20px;line-height:1.2}
.status span{color:var(--muted);font-size:15px}
.bar{position:relative;height:34px;border-radius:10px;background:var(--on);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;background:var(--off);border-left:2px solid var(--panel);border-right:2px solid var(--panel)}
.bar i.maybe{background:var(--maybe)}
.now{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--text);border-radius:2px;box-shadow:0 0 0 2px var(--panel)}
.ticks{position:relative;height:18px;margin-top:6px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}.ticks span:last-child{transform:translateX(-100%)}
.times{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.time{background:var(--panel2);border-radius:10px;padding:7px 11px;font-weight:700;font-variant-numeric:tabular-nums}
.time small{color:var(--muted);font-weight:500;margin-left:6px}
.time.maybe{outline:2px solid var(--maybe)}
.total{display:flex;justify-content:space-between;margin-bottom:12px;font-weight:700}
.total span{color:var(--muted);font-weight:500}
.row{display:grid;grid-template-columns:38px 1fr 54px;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.row .name{font-weight:800;font-size:17px}
.row .hrs{color:var(--muted);font-size:14px;text-align:right;font-variant-numeric:tabular-nums}
.row .bar{height:24px;border-radius:8px}
.row.mine .name{color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--muted);font-size:13px;margin-top:12px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.empty{color:var(--muted);text-align:center;padding:26px 8px}
footer{color:var(--muted);font-size:13px;text-align:center;margin-top:22px}
footer a{color:inherit}
.hint{color:var(--muted);font-size:14px;margin:0 0 12px}
.cal h3{margin:0 0 4px;font-size:17px}
.cal p{margin:0 0 12px;color:var(--muted);font-size:14px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;border:0;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;padding:10px 14px;border-radius:12px;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--panel2);color:var(--text)}
/* дашборд */
.big{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.big b{font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.big span{color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
@media (max-width:480px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{border:1px solid var(--line);background:var(--panel2);color:var(--text);font:inherit;border-radius:12px;padding:8px 2px;cursor:pointer;text-align:center;min-width:0}
.tile b{display:block;font-size:16px}
.tile small{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}
.tile.off{background:color-mix(in srgb,var(--off) 24%,var(--panel));border-color:var(--off)}
.tile.on{background:color-mix(in srgb,var(--on) 16%,var(--panel));border-color:color-mix(in srgb,var(--on) 55%,var(--line))}
.card h3{margin:0 0 4px;font-size:17px}
.card .note{margin:0 0 12px;color:var(--muted);font-size:14px}
.ev{display:grid;grid-template-columns:54px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.ev:first-of-type{border-top:0}
.ev .t{font-weight:800}
.ev .q{font-weight:700}
.ev .k{color:var(--muted);font-size:13px;display:block}
.chartwrap{display:grid;grid-template-columns:26px 1fr;gap:6px}
.yax{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;height:130px;line-height:1}
.cols{display:flex;gap:2px;align-items:stretch;height:130px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) 0 50%/100% 1px no-repeat}
.hc{flex:1;min-width:0;border:0;padding:0;background:none;display:flex;align-items:flex-end;cursor:pointer;border-radius:4px 4px 0 0}
.hc i{display:block;width:100%;background:var(--off);border-radius:4px 4px 0 0;min-height:0}
.hc.fut i{opacity:.55}
.hc.cur{background:var(--panel2)}
@media (hover:hover){.hc:hover{background:var(--panel2)}}
.readout{margin-top:12px;min-height:22px;font-weight:600;font-size:14px}
.ticks.ml{margin-left:32px}
.rank{display:grid;grid-template-columns:38px 1fr 76px;gap:10px;align-items:center;padding:5px 0;cursor:pointer}
.rank .name{font-weight:800}
.rank .track{height:14px;border-radius:7px;background:var(--panel2);overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--off);border-radius:7px}
.rank .v{text-align:right;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 64 64"><path d="M36 8 18 36h12l-4 20 20-30H33z" fill="#1c1608"/></svg></div>
    <div><h1>Світло · Черкаська область</h1><div class="sub" id="sub"></div></div>
  </header>
  <div class="seg" id="tabs" role="group" aria-label="Розділ"></div>
  <div class="seg" id="days" role="group" aria-label="День"></div>
  <div class="picker" id="chips" role="group" aria-label="Черга"></div>
  <div id="main"></div>
  <footer>Джерело: Черкасиобленерго · <span id="upd"></span><br>Неофіційний сайт, дані можуть змінюватись.</footer>
</div>
<script>
const D = {"updated":"09.11 11:15","history":{},"days":[{"date":"2026-11-09","name":"Сьогодні","label":"9 листопада","full":"9 листопада, понеділок","groups":{"1.1":[[0.0,1.0,0],[4.0,7.0,0],[10.0,14.0,0],[16.0,20.0,0],[22.0,24.0,0]],"1.2":[[0.0,2.0,0],[5.0,9.0,0],[11.0,15.0,0],[17.0,21.0,0],[23.0,24.0,0]],"2.1":[[0.0,2.0,0],[5.0,8.0,0],[10.0,14.0,0],[16.0,20.0,0],[22.0,24.0,0]],"2.2":[[0.0,2.0,0],[5.0,9.0,0],[11.0,15.0,0],[17.0,21.0,0],[23.0,24.0,0]],"3.1":[[1.0,3.0,0],[6.0,10.0,0],[12.0,16.0,0],[18.0,22.0,0]],"3.2":[[2.0,4.0,0],[7.0,11.0,0],[13.0,17.0,0],[19.0,22.0,0]],"4.1":[[0.0,3.0,0],[6.0,10.0,0],[12.0,16.0,0],[18.0,22.0,0]],"4.2":[[1.0,5.0,0],[7.0,11.0,0],[13.0,17.0,0],[19.0,23.0,0]],"5.1":[[2.0,5.0,0],[8.0,12.0,0],[14.0,18.0,0],[20.0,23.0,0]],"5.2":[[3.0,6.0,0],[9.0,13.0,0],[15.0,19.0,0],[21.0,24.0,0]],"6.1":[[2.0,5.0,0],[8.0,12.0,0],[14.0,18.0,0],[20.0,24.0,0]],"6.2":[[0.0,1.0,0],[3.0,7.0,0],[9.0,13.0,0],[15.0,19.0,0],[21.0,24.0,0]]}}]};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, "0");
const store = {
  get(k, d){ try { return localStorage.getItem(k) ?? d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
};
function fmt(x){ let h = Math.floor(x + 1e-9), m = Math.round((x - h) * 60); if (m === 60){ h++; m = 0; } return m ? pad(h) + ":" + pad(m) : pad(h); }
function clock(x){ let h = Math.floor(x + 1e-9), m = Math.round((x - h) * 60); if (m === 60){ h++; m = 0; } return pad(h) + ":" + pad(m); }
function dur(h){ const m = Math.round(h * 60), a = Math.floor(m / 60), b = m % 60; return (a ? a + " год" : "") + (a && b ? " " : "") + (b ? b + " хв" : ""); }
function hoursText(h){ return (Math.round(h * 10) / 10).toString().replace(".", ",") + " год"; }

let fmtNow;
try { fmtNow = new Intl.DateTimeFormat("en-GB", {timeZone:"Europe/Kyiv", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}); }
catch(e){ fmtNow = new Intl.DateTimeFormat("en-GB", {timeZone:"Europe/Kiev", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}); }
function kyivNow(){
  const p = Object.fromEntries(fmtNow.formatToParts(new Date()).map(x => [x.type, x.value]));
  return {date: p.year + "-" + p.month + "-" + p.day, h: +p.hour + +p.minute / 60};
}

const queues = [...new Set(D.days.flatMap(d => Object.keys(d.groups)))];
let qSel = store.get("q", "all"); if (qSel !== "all" && !queues.includes(qSel)) qSel = "all";
{ const u = new URLSearchParams(location.search).get("q"); if (u && queues.includes(u)) qSel = u; }  // ?q=3.1 — пряме посилання на чергу
let tab = store.get("tab", "sched"); if (tab !== "dash") tab = "sched";
{ const u = new URLSearchParams(location.search).get("tab"); if (u === "dash" || u === "sched") tab = u; }  // ?tab=dash
let dSel = 0;
{ const n = kyivNow(), i = D.days.findIndex(d => d.date === n.date); dSel = i >= 0 ? i : 0; }

const sure = (day, q) => ((day && day.groups[q]) || []).filter(x => !x[2]).sort((a, b) => a[0] - b[0]);
const total = (day, q) => sure(day, q).reduce((s, x) => s + x[1] - x[0], 0);

function bar(day, q, now){
  const segs = ((day.groups[q]) || []).map(([a, b, m]) =>
    `<i class="${m ? "maybe" : ""}" style="left:${a / 24 * 100}%;width:${(b - a) / 24 * 100}%"></i>`).join("");
  const line = now && now.date === day.date ? `<div class="now" style="left:calc(${now.h / 24 * 100}% - 1px)"></div>` : "";
  return `<div class="bar">${segs}</div>`.replace("</div>", line + "</div>");
}
function ticks(step = 3){ const hs = []; for (let h = 0; h <= 24; h += step) hs.push(h); return `<div class="ticks">${hs.map(h => `<span style="left:${h / 24 * 100}%">${pad(h)}</span>`).join("")}</div>`; }

function status(q, now){
  const today = D.days.find(d => d.date === now.date);
  if (!today) return null;
  const tomorrow = D.days.find(d => d.date > now.date);
  const t = sure(today, q);
  const cur = t.find(x => x[0] <= now.h && now.h < x[1]);
  if (cur){
    let end = cur[1];
    if (end >= 24){ const n = sure(tomorrow, q).find(x => x[0] < 0.01); if (n) end = 24 + n[1]; }
    return {off: true, until: end};
  }
  const next = t.find(x => x[0] > now.h);
  if (next) return {off: false, until: next[0]};
  const n2 = sure(tomorrow, q)[0];
  return {off: false, until: n2 ? 24 + n2[0] : null};
}
function when(x){ return x >= 24 ? "завтра о " + clock(x - 24) : "о " + clock(x); }

function render(){
  const now = kyivNow(), day = D.days[dSel], el = $("main");
  if (!day){ el.innerHTML = '<div class="card empty">Графіка поки немає</div>'; return; }
  $("days").innerHTML = D.days.map((d, i) =>
    `<button aria-pressed="${i === dSel}" data-d="${i}">${d.name}<small>${d.label}</small></button>`).join("");
  const rows = Math.max(1, ...Object.values(queues.reduce((m, q) => (m[q.split(".")[0]] = (m[q.split(".")[0]] || 0) + 1, m), {})));
  $("chips").innerHTML = `<button class="chip wide" aria-pressed="${qSel === "all"}" data-q="all">📋 Усі черги</button>` +
    `<div class="qgrid" style="--rows:${rows}">` + queues.map(q =>
      `<button class="chip" aria-pressed="${q === qSel}" data-q="${q}">${q}</button>`).join("") + "</div>";
  $("days").style.display = D.days.length > 1 ? "" : "none";  // один день: перемикач не потрібен
  $("sub").textContent = day.full + (D.days.length > 1 ? "" : " · графіка на завтра ще немає");
  $("upd").textContent = "оновлено " + D.updated;
  $("tabs").innerHTML = [["sched", "📋 Графік"], ["dash", "📊 Дашборд"]].map(([k, t]) =>
    `<button aria-pressed="${tab === k}" data-tab="${k}">${t}</button>`).join("");
  $("chips").style.display = tab === "dash" ? "none" : "";

  if (!day || !queues.length){ el.innerHTML = '<div class="card empty">Графіка поки немає</div>'; return; }
  if (tab === "dash"){ el.innerHTML = dashboard(now, day); return; }
  const legend = `<div class="legend"><span><i style="background:var(--on)"></i>Світло є</span><span><i style="background:var(--off)"></i>Світла немає</span>${
    Object.values(day.groups).some(g => g.some(x => x[2])) ? '<span><i style="background:var(--maybe)"></i>Можливо</span>' : ""}</div>`;

  if (qSel === "all"){
    el.innerHTML = `<div class="card"><p class="hint">Натисни на чергу, щоб побачити її докладно</p>${
      queues.map(q => `<div class="row" data-q="${q}"><div class="name">${q}</div>${bar(day, q, now)}<div class="hrs">${total(day, q) ? hoursText(total(day, q)) : "—"}</div></div>`).join("")}
      ${ticks(6).replace('class="ticks"', 'class="ticks" style="margin-left:48px;margin-right:64px"')}${legend}</div>`;
  } else {
    const st = status(qSel, now), isToday = day.date === now.date;
    let head = "";
    if (isToday && st){
      const left = st.until == null ? null : (st.until - now.h) * 60 > 0 ? dur(st.until - now.h) : null;
      head = `<div class="card status"><div class="dot ${st.off ? "off" : "on"}">${st.off ? "🔴" : "💡"}</div><div>
        <b>${st.off ? "Зараз світла немає" : "Зараз світло є"}</b>
        <span>${st.until == null ? "Відключень більше немає" : (st.off ? "Повернеться " : "Наступне відключення ") + when(st.until) + (left ? " · ще " + left : "")}</span></div></div>`;
    }
    const list = (day.groups[qSel] || []).slice().sort((a, b) => a[0] - b[0]);
    const tt = total(day, qSel);
    el.innerHTML = head + `<div class="card"><div class="total"><div>Черга ${qSel}</div><span>${tt ? "без світла " + hoursText(tt) : "відключень немає"}</span></div>
      ${bar(day, qSel, now)}${ticks()}
      <div class="times">${list.length ? list.map(([a, b, m]) => `<div class="time ${m ? "maybe" : ""}">${fmt(a)}–${fmt(b)}<small>${m ? "можливо" : dur(b - a)}</small></div>`).join("") : '<div class="empty" style="padding:6px 0">Світло є весь день ✨</div>'}</div>
      ${legend}</div>` + calendarCard(qSel);
  }
}

// ---------- дашборд ----------
const HIST = D.history || {};
const WD = ["Нд", "Пн", "Вт", "Ср", "Чт", "Пт", "Сб"];
const byName = (a, b) => a.localeCompare(b, "uk", {numeric: true});
const sumSpans = spans => spans.reduce((s, x) => s + x[1] - x[0], 0);

function series(){  // останні дні: історія, а для сьогодні/завтра — свіжіші дані зі сторінки
  const m = {};
  for (const [d, g] of Object.entries(HIST)) m[d] = g;
  for (const d of D.days) m[d.date] = Object.fromEntries(queues.map(q => [q, sure(d, q).map(x => [x[0], x[1]])]));
  return Object.keys(m).sort().slice(-14).map(date => ({date, groups: m[date]}));
}
function avgOff(groups){ const hs = queues.map(q => sumSpans(groups[q] || [])); return hs.reduce((a, b) => a + b, 0) / (hs.length || 1); }

function upcoming(now){
  const days = D.days.filter(d => d.date >= now.date).slice(0, 2);
  if (!days.length || days[0].date !== now.date) return [];
  const ev = new Map();
  for (const q of queues){
    const iv = [];
    days.forEach((d, i) => sure(d, q).forEach(([a, b]) => iv.push([a + 24 * i, b + 24 * i])));
    iv.sort((x, y) => x[0] - y[0]);
    const m = [];
    for (const x of iv){ const l = m[m.length - 1]; if (l && x[0] <= l[1] + 1e-6) l[1] = Math.max(l[1], x[1]); else m.push([x[0], x[1]]); }
    for (const [a, b] of m){
      if (a > now.h) add(a, true, q);
      if (b > now.h && b < 24 * days.length - 1e-6) add(b, false, q);
    }
  }
  function add(t, off, q){ const k = Math.round(t * 60) + (off ? "o" : "n"); if (!ev.has(k)) ev.set(k, {t, off, qs: []}); ev.get(k).qs.push(q); }
  return [...ev.values()].sort((x, y) => x.t - y.t || (y.off - x.off)).slice(0, 6);
}

function dashboard(now, day){
  const N = queues.length, isToday = day.date === now.date;
  let offNow = 0;
  const tiles = queues.map(q => {
    if (isToday){
      const st = status(q, now); if (st && st.off) offNow++;
      const sub = !st ? "" : st.until == null ? "весь день" : (st.off ? "до " : "з ") + clock(st.until % 24);
      return `<button class="tile ${st ? (st.off ? "off" : "on") : ""}" data-tile="${q}" title="Черга ${q}: ${st ? (st.off ? "світла немає" : "світло є") : ""}"><b>${q}</b><small>${sub}</small></button>`;
    }
    const h = total(day, q);
    return `<button class="tile" data-tile="${q}"><b>${q}</b><small>${h ? hoursText(h) : "без відкл."}</small></button>`;
  }).join("");
  const avg = avgOff(Object.fromEntries(queues.map(q => [q, sure(day, q)])));
  const hero = isToday
    ? `<div class="big"><b>${offNow}</b><span>із ${N} черг без світла зараз</span></div>`
    : `<div class="big"><b>${hoursText(avg).replace(" год", "")}</b><span>год без світла в середньому на чергу · ${day.name.toLowerCase()}</span></div>`;
  const legend = isToday ? `<div class="legend"><span><i style="background:var(--off)"></i>світла немає</span><span><i style="background:var(--on)"></i>світло є</span><span>натисни чергу — докладніше</span></div>` : `<div class="legend"><span>натисни чергу — докладніше</span></div>`;
  let html = `<div class="card">${hero}<div class="tiles">${tiles}</div>${legend}</div>`;

  const up = upcoming(now);
  if (isToday && up.length){
    html += `<div class="card"><h3>⏭ Найближчі зміни</h3><p class="note">Що станеться далі по всіх чергах</p>${up.map(e =>
      `<div class="ev"><div class="t">${clock(e.t % 24)}</div><div><span class="q">${e.off ? "🔴 вимикають" : "🟢 вмикають"}: ${e.qs.sort(byName).join(", ")}</span><span class="k">${e.t >= 24 ? "завтра" : "за " + dur(e.t - now.h)}</span></div></div>`).join("")}</div>`;
  }

  // скільки черг без світла в кожну годину
  const hourly = Array.from({length: 24}, (_, h) => queues.reduce((s, q) => s + sure(day, q).reduce((t, [a, b]) => t + Math.max(0, Math.min(b, h + 1) - Math.max(a, h)), 0), 0));
  const mx = Math.max(...hourly), mn = Math.min(...hourly);
  const hr = h => pad(h) + ":00–" + pad(h + 1) + ":00";
  const tip = h => hr(h) + " · без світла " + (Math.round(hourly[h] * 10) / 10).toString().replace(".", ",") + " із " + N + " черг";
  const peak = hourly.indexOf(mx), calm = hourly.indexOf(mn);
  const curH = isToday ? Math.floor(now.h) : -1;
  html += `<div class="card"><h3>🕐 Навантаження за годинами</h3><p class="note">Скільки черг одночасно без світла · ${day.full}</p>
    <div class="chartwrap"><div class="yax"><span>${N}</span><span>${Math.round(N / 2)}</span><span>0</span></div>
    <div class="cols" id="hcols">${hourly.map((v, h) => `<button class="hc ${h === curH ? "cur" : ""} ${isToday && h > curH ? "fut" : ""}" data-h="${h}" data-tip="${tip(h)}" title="${tip(h)}" aria-label="${tip(h)}"><i style="height:${v / N * 100}%"></i></button>`).join("")}</div></div>
    ${ticks(3).replace('class="ticks"', 'class="ticks ml"')}
    <div class="readout" id="readout">${mx ? `Найбільше без світла: <b>${hr(peak)}</b> (${Math.round(mx * 10) / 10} із ${N}) · найспокійніше: <b>${hr(calm)}</b> (${Math.round(mn * 10) / 10})` : "У цей день відключень за графіком немає 🎉"}</div>
    <div class="legend"><span><i style="background:var(--off)"></i>черг без світла</span>${isToday ? '<span><i style="background:var(--panel2);border:1px solid var(--line)"></i>зараз</span><span>світліші стовпці — ще попереду</span>' : ""}<span>торкнись стовпця — подробиці</span></div></div>`;

  // історія по днях + рейтинг
  const sr = series();
  if (sr.length >= 2){
    const vals = sr.map(x => avgOff(x.groups)), top = Math.max(6, Math.ceil(Math.max(...vals) / 2) * 2);
    const hi = vals.indexOf(Math.max(...vals));
    html += `<div class="card"><h3>📈 Скільки світла забирають відключення</h3><p class="note">Середня тривалість відключень на чергу за добу, годин</p>
      <div class="chartwrap"><div class="yax" style="height:110px"><span>${top}</span><span>${top / 2}</span><span>0</span></div>
      <div class="cols" style="height:110px">${sr.map((x, i) => {
        const dt = new Date(x.date + "T12:00:00"), fut = x.date > now.date, tp = WD[dt.getDay()] + " " + dt.getDate() + "." + pad(dt.getMonth() + 1) + " · " + hoursText(vals[i]) + " на чергу";
        return `<button class="hc ${x.date === now.date ? "cur" : ""} ${fut ? "fut" : ""}" data-tip="${tp}" title="${tp}" aria-label="${tp}"><i style="height:${vals[i] / top * 100}%"></i></button>`;}).join("")}</div></div>
      <div class="cols" style="height:auto;border:0;background:none;margin:4px 0 0 32px">${sr.map(x => { const dt = new Date(x.date + "T12:00:00"); return `<span style="flex:1;text-align:center;font-size:11px;color:var(--muted)">${sr.length <= 10 ? WD[dt.getDay()] : dt.getDate()}</span>`; }).join("")}</div>
      <div class="readout" id="readout2">Найважчий день: <b>${new Date(sr[hi].date + "T12:00:00").getDate()}.${pad(new Date(sr[hi].date + "T12:00:00").getMonth() + 1)}</b> — ${hoursText(vals[hi])} на чергу</div></div>`;

    const per = queues.map(q => ({q, h: sr.reduce((s, x) => s + sumSpans(x.groups[q] || []), 0) / sr.length})).sort((a, b) => a.h - b.h || byName(a.q, b.q));
    const m = Math.max(...per.map(x => x.h)) || 1;
    html += `<div class="card"><h3>🏆 Рейтинг черг</h3><p class="note">Від найсвітлішої до найтемнішої · у середньому за добу, ${sr.length} дн.</p>${per.map((x, i) =>
      `<div class="rank" data-tile="${x.q}"><div class="name">${x.q}</div><div class="track"><i style="width:${x.h / m * 100}%"></i></div><div class="v">${i === 0 ? "😎 " : i === per.length - 1 && per.length > 1 ? "🥶 " : ""}${hoursText(x.h)}</div></div>`).join("")}</div>`;
  } else {
    html += `<div class="card empty">📈 Історія та рейтинг черг з'являться, коли бот назбирає хоча б 2 дні даних</div>`;
  }
  if (sr.length < 7) html += `<p class="hint" style="text-align:center">Історія накопичується щодня, зараз у ній ${sr.length} дн.</p>`;
  return html;
}

function calUrl(q){ return new URL("cal/" + q.replace(".", "-") + ".ics", location.href); }
function calendarCard(q){
  const https = calUrl(q).href, webcal = https.replace(/^https?:/, "webcal:");
  return `<div class="card cal"><h3>📅 Нагадування в календарі</h3>
    <p>Відключення черги ${q} з'являться у твоєму календарі, а телефон нагадає за 15 хвилин до відключення.</p>
    <div class="btns"><a class="btn" href="${webcal}">Підписатись</a>
    <a class="btn alt" href="${https}" download>Завантажити .ics</a>
    <button class="btn alt" data-act="copy" data-v="${https}">Скопіювати посилання</button></div>
    <p style="margin:12px 0 0">Google Календар: «Інші календарі» → «Із URL» → встав скопійоване посилання.</p></div>
    <div class="btns" style="margin-bottom:14px"><button class="btn alt" data-act="share">🔗 Поділитись цією чергою</button></div>`;
}
function toast(t){
  let el = $("toast"); if (!el){ el = document.createElement("div"); el.id = "toast"; el.className = "toast"; document.body.appendChild(el); }
  el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}
async function copy(text, ok){
  try { await navigator.clipboard.writeText(text); toast(ok); }
  catch(e){ window.prompt("Скопіюй посилання:", text); }
}

document.addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act){
    if (act.dataset.act === "copy") copy(act.dataset.v, "Посилання скопійовано");
    if (act.dataset.act === "share"){
      const url = location.origin + location.pathname + "?q=" + encodeURIComponent(qSel);
      if (navigator.share) navigator.share({title: "Світло · черга " + qSel, url}).catch(() => {});
      else copy(url, "Посилання на чергу " + qSel + " скопійовано");
    }
    return;
  }
  const hc = e.target.closest(".hc");
  if (hc){ const ro = hc.closest(".card").querySelector(".readout"); if (ro) ro.textContent = hc.dataset.tip; return; }
  const tl = e.target.closest("[data-tile]"); if (tl){ qSel = tl.dataset.tile; tab = "sched"; store.set("q", qSel); store.set("tab", tab); render(); window.scrollTo(0, 0); return; }
  const tb = e.target.closest("[data-tab]"); if (tb){ tab = tb.dataset.tab; store.set("tab", tab); render(); return; }
  const d = e.target.closest("[data-d]"); if (d){ dSel = +d.dataset.d; render(); return; }
  const q = e.target.closest("[data-q]"); if (q){ qSel = q.dataset.q; store.set("q", qSel); render(); }
});
render();
setInterval(render, 60000);
</script>
